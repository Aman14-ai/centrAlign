{% extends "base.html" %}
{% block content %}
<h1>ERP — Invoice Entry</h1>

{% if message %}
<div class="message {% if 'ERROR' in message %}error{% else %}success{% endif %}">
    {{ message }}
</div>
{% endif %}

<form method="post" action="/app/erp">
    <label>Invoice ID
        <input id="invoice_id" name="invoice_id" required>
    </label>
    <label>Vendor ID
        <input id="vendor_id" name="vendor_id" required>
    </label>
    <label>Amount
        <input id="amount" name="amount" type="number" step="0.01" required>
    </label>
    <label>Due Date
        <input id="due_date" name="due_date" type="date">
    </label>
    <label>PO Number
        <input id="po_number" name="po_number">
    </label>
    <button id="submit-btn" type="submit">Submit Invoice</button>
</form>
{% endblock %}
